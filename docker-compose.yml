services:
  dashboard:
    build: .
    command: ["dashboard", "--port", "3778"]
    environment:
      - PMEM_HOST=0.0.0.0
    ports:
      - "3778:3778"
    volumes:
      - .:/workspace

  api:
    build: .
    command: ["api", "--port", "3779"]
    environment:
      - PMEM_HOST=0.0.0.0
    ports:
      - "3779:3779"
    volumes:
      - .:/workspace

  mcp:
    build: .
    command: ["serve", "--port", "3777"]
    environment:
      - PMEM_HOST=0.0.0.0
    ports:
      - "3777:3777"
    volumes:
      - .:/workspace
