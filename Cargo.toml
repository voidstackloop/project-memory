[package]
name = "project-memory"
version = "0.2.0"
edition = "2021"
description = "Context-aware project memory for AI agents — CLI + MCP server"
license = "MIT"

[[bin]]
name = "pmem"
path = "src/main.rs"

[lib]
name = "project_memory"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
colored = "3"
dirs = "6"
toml = "0.8"
strsim = "0.11"
crossterm = "0.28"
ratatui = "0.29"
serde_yaml = "0.9"
glob = "0.3"
walkdir = "2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
hex = "0.4"
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
rand = "0.8"
